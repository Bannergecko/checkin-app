<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Check In">
    <title>Greater Lathrop Chamber - Check In</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen" style="background-color: #bcb2c4;">
    <div class="max-w-lg mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-8">
            <img src="glcc-primary-logo.png" alt="Greater Lathrop Chamber of Commerce" class="h-40 mx-auto mb-3">
            <p class="text-black text-2xl font-bold">Member Check-In</p>
        </header>

        <!-- Check-in Form -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6" style="padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.08);">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">New Check-In</h2>
            <form id="checkinForm" class="space-y-4">
                <div class="relative">
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                    <input type="text" id="name" autocomplete="off" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-lg"
                        placeholder="Search or enter name">
                    <div id="nameSuggestions" class="hidden absolute z-10 w-full bg-white border border-gray-300 rounded-lg mt-1 max-h-48 overflow-y-auto shadow-lg"></div>
                </div>
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                    <input type="tel" id="phone" inputmode="tel" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-lg"
                        placeholder="(555) 123-4567">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address *</label>
                    <input type="text" id="email" inputmode="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-lg"
                        placeholder="email@example.com">
                    <p id="emailError" class="hidden text-red-600 text-sm mt-1">Please enter a valid email address</p>
                </div>
                <button type="button" id="clearPerson" class="hidden text-sm text-indigo-600 hover:text-indigo-800">
                    Clear person info
                </button>
                <div>
                    <label for="event" class="block text-sm font-medium text-gray-700 mb-1">Event *</label>
                    <select id="event" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-lg bg-white">
                        <option value="">Select an event...</option>
                    </select>
                </div>
                <button type="submit"
                    class="w-full text-white py-4 rounded-lg font-semibold text-lg transition-colors"
                    style="background-color: #473243;">
                    Check In
                </button>
            </form>
        </div>

        <!-- Success Message (hidden by default) -->
        <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-6 py-4 rounded-lg mb-6">
            <p class="font-semibold">Check-in successful!</p>
        </div>

        <!-- Admin Section -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <button onclick="tryOpenAdmin()"
                class="w-full px-6 py-4 cursor-pointer hover:bg-gray-50 font-semibold text-gray-700 text-left">
                Admin & Data
            </button>
            <div id="adminContent" class="hidden px-6 pb-6 space-y-4 border-t border-gray-200 relative" style="padding-top: 32px;">
                <button onclick="closeAdmin()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-gray-200 text-gray-600 hover:bg-gray-300 font-bold text-lg">&times;</button>

                <!-- Event Management -->
                <div>
                    <h3 class="font-medium text-gray-800 mb-2">Manage Events</h3>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="newEvent" placeholder="New event name"
                            class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm">
                        <button onclick="addEvent()"
                            class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 text-sm font-medium">
                            Add
                        </button>
                    </div>
                    <div id="eventList" class="text-sm text-gray-600"></div>
                </div>

                <hr class="border-gray-200">

                <!-- Export Buttons -->
                <h3 class="font-medium text-gray-800">Export Data</h3>
                <div class="mb-2">
                    <label for="exportEvent" class="block text-sm text-gray-600 mb-1">Filter by event:</label>
                    <select id="exportEvent"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
                        <option value="">All Events</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportJSON()"
                        class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">
                        Export JSON
                    </button>
                    <button onclick="exportCSV()"
                        class="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-medium">
                        Export CSV
                    </button>
                </div>

                <!-- Data Count -->
                <p id="recordCount" class="text-sm text-gray-500">Total check-ins: 0</p>

                <!-- Clear Data -->
                <button onclick="clearData()"
                    class="w-full px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 text-sm font-medium">
                    Clear All Data
                </button>

                <!-- View Recent -->
                <details class="text-sm">
                    <summary class="cursor-pointer text-indigo-600 hover:text-indigo-700">View recent check-ins</summary>
                    <div id="recentList" class="mt-3 max-h-48 overflow-y-auto text-xs text-gray-600 space-y-1"></div>
                </details>

                <!-- Logout -->
                <button onclick="logout()"
                    class="w-full px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm font-medium">
                    Logout
                </button>
            </div>
        </div>

        <!-- Login Modal -->
        <div id="loginModal" class="hidden fixed inset-0 flex items-center justify-center z-50" style="background-color: rgba(0, 0, 0, 0.85);">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm mx-4" style="padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.08);">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Admin Login</h2>
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label for="loginEmail" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="loginEmail" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                            placeholder="Enter email">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="password" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                            placeholder="Enter password">
                    </div>
                    <p id="loginError" class="hidden text-red-600 text-sm">Invalid username or password</p>
                    <div class="flex gap-2">
                        <button type="submit"
                            class="flex-1 text-white py-3 rounded-lg font-semibold transition-colors"
                            style="background-color: #473243;">
                            Login
                        </button>
                        <button type="button" onclick="closeLoginModal()"
                            class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center mt-8 text-sm text-gray-500">
            Greater Lathrop Chamber of Commerce
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
